name: Daily README story card

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/readme-story-card.yml"
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  update:
    uses: imMamdouhaboammar/imMamdouhaboammar/.github/workflows/update-project-story-card.yml@main
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
